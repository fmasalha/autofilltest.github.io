<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submitted</title>
<style>
  :root { font-family: -apple-system, system-ui, sans-serif; }
  body {
    max-width: 480px; margin: 64px auto; padding: 0 12px; color: #1c1b1f;
    text-align: center;
  }
  .check {
    width: 72px; height: 72px; margin: 0 auto 24px;
    border-radius: 50%; background: #138a36;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 40px; font-weight: 700;
  }
  h2 { font-weight: 600; margin: 0 0 8px; }
  p { color: #555; }
  a.return {
    display: inline-block; margin-top: 32px; padding: 12px 28px;
    background: #0060df; color: #fff; border-radius: 6px;
    text-decoration: none; font-weight: 600;
  }
  a.return:hover { background: #003eaa; }
  details {
    margin-top: 32px; text-align: left; background: #f4f4f6;
    border-radius: 6px; padding: 12px; font-size: 13px;
  }
  details summary { cursor: pointer; font-weight: 600; }
  pre { white-space: pre-wrap; word-break: break-all; margin: 8px 0 0; }
</style>
</head>
<body>
<div class="check">&check;</div>
<h2>Address submitted</h2>
<p>The form was submitted. Check Logcat for the <code>SaveAddress</code> log.</p>

<a class="return" href="/address-capture-test.html">Return to form</a>

<details>
  <summary>Submitted values</summary>
  <pre id="vals">(none)</pre>
</details>

<script>
  const params = new URLSearchParams(location.search);
  if ([...params].length) {
    document.getElementById("vals").textContent =
      [...params].map(([k, v]) => `${k}: ${v}`).join("\n");
  }
</script>
</body>
</html>
